[package]
name = "panini-lang-core"
version = "0.3.0"
edition = "2024"
description = "Core traits and types for the Panini linguistic feature extraction framework"
repository = "https://github.com/yro7/panini.git"
license = "MIT"
keywords = ["linguistics", "nlp", "llm", "extraction"]
categories = ["science", "text-processing"]
readme = "../README.md"


[dependencies]
panini-macro = { version = "0.3.0", path = "../panini-macro", package = "panini-lang-macro" }
schemars = { version = "1.2.1", features = ["uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
isolang = { version = "2.4.0", features = ["english_names", "local_names"] }
iso15924 = "0.1.0"
thiserror = "2"
regex = "1"
