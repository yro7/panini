[package]
name = "panini-lang-langs"
version = "0.3.0"
edition = "2024"
description = "Language-specific definitions and presets for the Panini linguistic feature extraction framework"
repository = "https://github.com/yro7/panini.git"
license = "MIT"
keywords = ["linguistics", "nlp", "llm", "extraction", "languages"]
categories = ["science", "text-processing"]
readme = "../README.md"


[dependencies]
panini-core = { version = "0.3.0", path = "../panini-core", package = "panini-lang-core" }
panini-macro = { version = "0.3.0", path = "../panini-macro", package = "panini-lang-macro" }
schemars = "1.0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Optional: needed for the language registry (panini-cli)
panini-engine = { version = "0.3.0", path = "../panini-engine", optional = true, package = "panini-lang-engine" }
anyhow = { version = "1", optional = true }
rig-core = { version = "0.33", optional = true }

[features]
registry = ["dep:panini-engine", "dep:anyhow", "dep:rig-core"]
